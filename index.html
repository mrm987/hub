<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="모리모의 스토리챗 미니게임 허브">
    <title>모리모 게임 허브</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">모리모 게임 허브</h1>
            <p class="subtitle">크랙 스토리챗 미니게임</p>
        </header>

        <main class="game-grid">
            <a href="https://perrophone.chat-img.cc" class="game-card" target="_blank" rel="noopener noreferrer">
                <div class="game-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <div class="icon-text">📱</div>
                </div>
                <div class="game-info">
                    <h2 class="game-title">페로 폰 훔쳐보기</h2>
                    <p class="game-description">경찰과 괴도</p>
                </div>
            </a>

            <a href="https://threemessengers.chat-img.cc" class="game-card" target="_blank" rel="noopener noreferrer">
                <div class="game-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                    <div class="icon-text">✉️</div>
                </div>
                <div class="game-info">
                    <h2 class="game-title">지원군 요청하기</h2>
                    <p class="game-description">3인의 전령</p>
                </div>
            </a>
        </main>

        <footer class="footer">
            <p>© 2025 모리모 | 크랙 플랫폼</p>
        </footer>
    </div>
</body>
</html>
